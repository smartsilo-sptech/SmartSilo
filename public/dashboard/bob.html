<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/bob.css">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
<menu>
    <div class="menu-content">
        <div class="top-menu">
            <div class="menu-message">
                <a href="../index.html">
                    <span class="menu-title">Dashboard<br>SmartSilo</span>
                </a>            
            </div>
            <div class="menu-navigation">
                <div id="link">
                    <a href="./dash-visao-geral.html">
                        <span class="span-link">- Visão Geral</span>
                    </a>
                </div>
                <div id="link">
                    <a href="./dash-panoramica.html">
                        <span class="span-link">- Panorâmica</span>
                    </a>
                </div>
                <div id="link">
                    <a href="./dash-historico-alertas.html">
                        <span class="span-link">- Histórico de Alertas</span>
                    </a>
                </div>
                <div>
                <a href="/dashboard/bob.html">
                    <span class="span-link">- Suporte do Bob</span>
                </a>
                </div>
            </div>
        </div>
        <div class="bottom-menu">
            <span class="user-name" id="div_username">usuario</span>
            <button id="limparSessao" class="limparSessao" onclick="limparSessao()">SAIR</button>
        </div>
    </div>
</menu>
<main>
    <div id="containerBob">
        <h1>BobIA</h1>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <br><br>
        <button onclick="gerarResposta()">Gerar Resposta</button>
        <h3>Resposta da IA:</h3>
        <div id="resposta"></div>
    </div>
</main>
    <script src="../assets/js/sessao.js"></script>

    <script>
        validarSessao()

        div_username.innerHTML = sessionStorage.NOME_USUARIO

        async function gerarResposta() {
            console.log('botão clicado')
            const pergunta = document.getElementById('pergunta').value;
            console.log('pergunta:', pergunta)

            const response = await fetch('/bob/perguntar', {    
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            console.log('status da resposta:', response.status)
            const data = await response.json();
            console.log('data recebida:', data)

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
</body>
</html>
