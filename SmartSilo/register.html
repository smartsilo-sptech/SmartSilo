<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSilo - Registrar-se</title>
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/header.css">
    <link rel="stylesheet" href="./src/css/register.css">

    <script src="./src/js/sessao.js"></script>
    <script src="./src/js/register.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <img src="./src/img/icons/logoNova.png" alt="Logo SmartSilo">
            </div>
            <nav class="header-menu">
                <a href="./index.html">Home</a>
                <a href="./calc.html">Calculadora Financeira</a>
                <a href="./login.html" class="btn-login">Entrar</a>
                <a href="./register.html" class="btn-register">Registrar-se</a>
            </nav>
        </div>
    </header>
    <main class="register-hero">
        <div class="register-over"></div>
        <div class="register-content">
            <div class="register-left">
                <h1>Crie sua conta na SmartSilo</h1>
                <p>Gerencie silos com tecnologia inteligente, acompanhe dados em tempo real e tenha acesso à dashboard da plataforma.</p>
            </div>
            <div class="register-right">
                <div class="register-card">
                    <img src="./src/img/icons/logo2.png" alt="Logo" class="register-icon">
                    <h2>Bem-vindo(a) ao SmartSilo</h2>
                    <form>
                        <label for="codigo_input">Código da empresa:</label>
                        <input type="text" id="codigo_input" name="code" placeholder="Insira o código da sua empresa" class="insert" required>

                        <label for="nome_input">Nome:</label>
                        <input type="text" id="nome_input" name="name" placeholder="Insira seu nome" class="insert" required>

                        <label for="email_input">E-Mail:</label>
                        <input type="email" id="email_input" name="email" placeholder="Insira seu e-mail" class="insert" required>

                        <label for="senha_input">Senha:</label>
                        <input type="password" id="senha_input" name="password" placeholder="Crie uma senha" class="insert" required>

                        <label for="confirmacao_senha_input">Confirmar Senha:</label>
                        <input type="password" id="confirmacao_senha_input" name="confipassword" placeholder="Confirme a senha" class="insert" required>

                        <button type="submit" class="btn-primary">CADASTRAR</button>
                    </form>
                    <span class="redirect">Já possui conta? <a href="./login.html">Entrar</a></span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
