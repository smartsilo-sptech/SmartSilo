<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSilo - Entrar</title>
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/headerCopy.css">
    <link rel="stylesheet" href="./src/css/login.css">
</head>
<body>
    <header class="header">
        <div class="header-content">

            <div class="header-logo">
                <img src="./src/img/icons/logoNova.png" alt="Logo SmartSilo">
            </div>

            <nav class="header-menu">
                <a href="./indexcopy.html">Home</a>
                <a href="./calc.html">Calculadora Financeira</a>

                <a href="./logincopy.html" class="btn-login">
                    Entrar
                </a>

                <a href="./registercopy.html" class="btn-register">
                    Registrar-se
                </a>
            </nav>

        </div>
    </header>

    <main class="login-hero">

        <div class="login-over"></div>

        <div class="login-content">

            <div class="login-left">

                <h1>
                    Bem-vindo(a) <br>
                    de volta à <br>
                    SmartSilo
                </h1>

                <p>
                    Monitore silos, acompanhe dados em tempo real
                    e tenha acesso à dashboard inteligente da plataforma.
                </p>

            </div>

            <div class="login-right">

                <div class="login-card">

                    <img src="./src/img/icons/logo2.png" alt="Logo" class="login-icon">

                    <h2>Entrar</h2>

                    <form>

                        <label>E-mail</label>
                        <input
                        type="email" id="email_input"
                        placeholder="Insira seu e-mail"
                        required>

                        <label>Senha</label>
                        <input
                        type="password" id="senha_input"
                        placeholder="Insira sua senha"
                        required>

                        <a href="#" class="forgot-password">
                            Esqueceu sua senha?
                        </a>

                        <button type="submit" class="btn-primary">
                            ENTRAR
                        </button>

                    </form>

                    <span class="redirect">
                        Ainda não possui conta?
                        <a href="./registercopy.html">
                            Registre-se
                        </a>
                    </span>

                </div>

            </div>

        </div>

    </main>

</body>
</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
