<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSilo - Registrar-se</title>
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/headerCopy.css">
    <link rel="stylesheet" href="./src/css/register.css">
    
</head>
<body>
    <header class="header">
        <div class="header-content">

            <div class="header-logo">
                <img src="./src/img/icons/logoNova.png" alt="Logo SmartSilo">
            </div>

            <nav class="header-menu">
                <a href="./indexcopy.html#sobre">Sobre</a>
                <a href="./calc.html">Calculadora Financeira</a>

                <a href="./logincopy.html" class="btn-login">
                    Entrar
                </a>

                <a href="./registercopy.html" class="btn-register">
                    Registrar-se
                </a>
            </nav>

        </div>
    </header>

    <main class="register-hero">
        <div class="register-over"></div>
            <div class="register-content">
                <div class="register-left">
                    <h1>
                        Crie sua conta na SmartSilo
                    </h1>
                    <p>
                        Gerencie silos com tecnologia inteligente, acompanhe dados em tempo real e tenha acesso à dashboard da plataforma.
                    </p>
                </div>
            

                <div class="register-right">
                    <div class="register-card">

                                <img src="./src/img/icons/logo2.png" alt="Logo" class="register-icon">

                                <h2>Bem-vindo(a) ao SmartSilo</h2>
                    
                    

                            <form>
                                <label for="nome">Nome:</label>
                                <input type="text" id="name" name="name" placeholder="Insira seu nome" class="insert" required>

                                <label for="email">E-Mail:</label>
                                <input type="email" id="email" name="email" placeholder="Insira seu e-mail" class="insert" required>

                                <label for="senha">Senha:</label>
                                <input type="password" id="password" name="password" placeholder="Crie uma senha" class="insert" required>

                                <label for="confirmarSenha">Confirmar Senha:</label>
                                <input type="password" id="confipassword" name="confipassword" placeholder="Confirme a senha" class="insert" required>

                                <button type="submit" class="btn-primary">
                                        CADASTRAR
                                </button>

                            </form>

                            <span class="redirect">
                                Já possui conta? 
                                <a href="./logincopy.html">Entrar</a>
                            </span>
                        

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
