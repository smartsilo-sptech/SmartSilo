<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSilo - Registrar-se</title>
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/headerCopy.css">
    <link rel="stylesheet" href="./src/css/register.css">
    
</head>
<body>
    <header class="header">
        <div class="header-content">

            <div class="header-logo">
                <img src="./src/img/icons/logoNova.png" alt="Logo SmartSilo">
            </div>

            <nav class="header-menu">
                <a href="./indexcopy.html">Home</a>
                <a href="./calc.html">Calculadora Financeira</a>

                <a href="./logincopy.html" class="btn-login">
                    Entrar
                </a>

                <a href="./registercopy.html" class="btn-register">
                    Registrar-se
                </a>
            </nav>

        </div>
    </header>

    <main class="register-hero">
        <div class="register-over"></div>
            <div class="register-content">
                <div class="register-left">
                    <h1>
                        Crie sua conta na SmartSilo
                    </h1>
                    <p>
                        Gerencie silos com tecnologia inteligente, acompanhe dados em tempo real e tenha acesso à dashboard da plataforma.
                    </p>
                </div>
            

                <div class="register-right">
                    <div class="register-card">

                                <img src="./src/img/icons/logo2.png" alt="Logo" class="register-icon">

                                <h2>Bem-vindo(a) ao SmartSilo</h2>
                    
                    

                            <form>
                                <label for="nome">Nome:</label>
                                <input type="text" id="nome_input" name="name" placeholder="Insira seu nome" class="insert" required>

                                <label for="email">E-Mail:</label>
                                <input type="email" id="email_input" name="email" placeholder="Insira seu e-mail" class="insert" required>

                                <label for="senha">Senha:</label>
                                <input type="password" id="senha_input" name="password" placeholder="Crie uma senha" class="insert" required>

                                <label for="confirmarSenha">Confirmar Senha:</label>
                                <input type="password" id="confirmacao_senha_input" name="confipassword" placeholder="Confirme a senha" class="insert" required>

                                <button type="submit" class="btn-primary">
                                        CADASTRAR
                                </button>

                            </form>

                            <span class="redirect">
                                Já possui conta? 
                                <a href="./logincopy.html">Entrar</a>
                            </span>
                        

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
